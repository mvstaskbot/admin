<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Files</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    background:#fff;
    color:#777;
    font-family:Arial,Helvetica,sans-serif;
    padding:34px 24px;
  }
  .top-title{
    max-width:1450px;
    margin:0 auto 22px;
    font-family:Georgia,"Times New Roman",serif;
    font-size:24px;
    color:#333;
  }
  .files{
    width:min(1450px,100%);
    margin:auto;
    border:2px solid #ddd;
    border-radius:42px;
    overflow:hidden;
    background:#fafafa;
    box-shadow:0 3px 14px rgba(0,0,0,.07);
  }
  .file{
    position:relative;
    min-height:245px;
    display:flex;
    align-items:center;
    gap:45px;
    padding:35px 78px;
    cursor:pointer;
    transition:background .18s ease,transform .18s ease;
  }
  .file:hover{background:#f4f7fb}
  .file:active{transform:scale(.995)}
  .file+.file{border-top:2px solid #dedede}
  .globe{
    width:82px;
    height:82px;
    flex:0 0 82px;
    border:7px solid #2878df;
    border-radius:50%;
    position:relative;
  }
  .globe .v1,.globe .v2{
    position:absolute;
    top:-7px;
    height:82px;
    width:30px;
    border-left:5px solid #2878df;
    border-right:5px solid #2878df;
    border-radius:50%;
  }
  .globe .v1{left:19px}
  .globe .v2{display:none}
  .globe .h{
    position:absolute;
    left:-7px;
    right:-7px;
    top:31px;
    height:7px;
    background:#2878df;
  }
  .filename{
    flex:1;
    min-width:0;
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(27px,4vw,52px);
    line-height:1.2;
    color:#777;
    overflow-wrap:anywhere;
  }
  .arrow{
    width:31px;
    height:31px;
    flex:0 0 31px;
    border-top:6px solid #777;
    border-right:6px solid #777;
    transform:rotate(45deg);
    margin-right:7px;
  }
  .notice{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translate(-50%,20px);
    background:#1f2937;
    color:white;
    padding:12px 18px;
    border-radius:10px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    box-shadow:0 8px 25px rgba(0,0,0,.2);
  }
  .notice.show{opacity:1;transform:translate(-50%,0)}
  @media(max-width:650px){
    body{padding:18px 10px}
    .files{border-radius:27px}
    .file{min-height:145px;padding:22px 25px;gap:18px}
    .file+.file{border-top-width:2px}
    .globe{width:52px;height:52px;flex-basis:52px;border-width:5px}
    .globe .v1{left:12px;top:-5px;height:52px;width:20px;border-width:4px}
    .globe .h{left:-5px;right:-5px;top:19px;height:5px}
    .filename{font-size:22px}
    .arrow{width:20px;height:20px;flex-basis:20px;border-width:4px;margin-right:2px}
  }
</style>
</head>
<body>

<div class="top-title">Files</div>

<div class="files">
  <div class="file" onclick="selectFile('MVS_Admin_Full_Control.html')">
    <div class="globe"><span class="v1"></span><span class="h"></span></div>
    <div class="filename">MVS_Admin_Full_Control.html</div>
    <div class="arrow"></div>
  </div>

  <div class="file" onclick="selectFile('user_full_control_firebase.html')">
    <div class="globe"><span class="v1"></span><span class="h"></span></div>
    <div class="filename">user_full_control_firebase.html</div>
    <div class="arrow"></div>
  </div>
</div>

<div id="notice" class="notice"></div>

<script>
function selectFile(name){
  const n=document.getElementById('notice');
  n.textContent='Selected: '+name;
  n.classList.add('show');
  setTimeout(()=>n.classList.remove('show'),1600);
}
</script>
</body>
</html>
